name: Feature Build

on:
  push:
    branches:
      - feature/dynamic-armor-emotecraft

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Build current dynamic armor branch
        run: ./gradlew clean build --stacktrace
